<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luxsignature Keepsakes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="bar"><div class="row in"><span id="annText"></span><a id="annLink" href="#products"></a></div></div>

<header class="head">
  <div class="row in">
    <a class="brand" href="#top" id="top">
      <span class="sq" id="mark" aria-hidden="true"></span>
      <img class="logo-img" id="logoImg" alt="" hidden>
      <span><span class="name" id="brandName"></span><span class="sub" id="brandSub"></span></span>
    </a>
    <span class="spacer"></span>
    <a class="shopnow" id="shopNow" href="#products"></a>
    <button class="cart" id="cart" aria-label="Cart, 0 items">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2.2l2.3 10.4a1 1 0 0 0 1 .8h8.6a1 1 0 0 0 1-.76L19.6 8H6.1"/><circle cx="9" cy="19.2" r="1.3" fill="currentColor" stroke="none"/><circle cx="16.6" cy="19.2" r="1.3" fill="currentColor" stroke="none"/></svg>
      <span class="badge" id="badge" hidden>0</span>
    </button>
    <button class="menu" id="menuBtn" aria-label="Menu" aria-expanded="false" aria-controls="menuPanel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 7h18M3 12h18M3 17h18"/></svg>
    </button>
  </div>
  <nav class="panel" id="menuPanel" aria-label="Main" hidden><div class="in" id="menuLinks"></div></nav>
</header>

<section class="hero">
  <div class="photo" id="heroPhoto" role="img" aria-label="Featured gift"></div>
  <div class="copy in">
    <h1 id="heroHeading"></h1>
    <p id="heroText"></p>
    <a class="pill" id="heroButton" href="#products"></a>
  </div>
</section>

<section class="products in" id="products">
  <h2>Featured gifts</h2>
  <div class="grid" id="grid"></div>
</section>

<div class="foot" id="footText"></div>

<script src="site.js"></script>
<script src="app.js"></script>
</body>
</html>
